/* 상단: 페너 이미지 영역 (50%) */

.penner-bubble{

.ev-grid{display:flex;gap:7px;}

.ev-item.active{

}
.ev-item.used{

}
.ev-item.locked{opacity:.15;}
.ev-item.wrong-shake{animation:shake .3s ease;}

<script>

bgm.volume = 0.15;

<script>
var evidenceEls = {
  ledger: document.getElementById('ev-ledger'),
  lodge: document.getElementById('ev-lodge'),
  cctv: document.getElementById('ev-cctv'),
  schedule: document.getElementById('ev-schedule'),
  looptalk: document.getElementById('ev-looptalk'),
  card: document.getElementById('ev-card'),
  family: document.getElementById('ev-family')
};
var pennerBubble = document.getElementById('penner-bubble');
var narrText = document.getElementById('narr-text');
var choicesDiv = document.getElementById('choices');
var promptText = document.getElementById('prompt-text');


/* ── iPhone Safari 대응 공용 음성 플레이어 ──
   최초 화면 탭에서 재생 권한을 확보하고,
   이후 모든 대사는 하나의 Audio 객체를 계속 재사용합니다. */
var chapter8VoiceAudio = new Audio();
chapter8VoiceAudio.preload = 'auto';
chapter8VoiceAudio.playsInline = true;
var chapter8VoiceToken = 0;

function unlockChapter8Audio() {
  var silentWav =
    'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQQAAAAAgICA';

  chapter8VoiceToken++;
  chapter8VoiceAudio.pause();
  chapter8VoiceAudio.src = silentWav;
  chapter8VoiceAudio.currentTime = 0;
  chapter8VoiceAudio.volume = 0.01;

  var voicePromise = chapter8VoiceAudio.play();
  var bgmPromise = bgm.play();

  var tasks = [];
  if (voicePromise && typeof voicePromise.catch === 'function') {
    tasks.push(voicePromise.catch(function(){}));
  }
  if (bgmPromise && typeof bgmPromise.catch === 'function') {
    tasks.push(bgmPromise.catch(function(){}));
  }

  return Promise.all(tasks).then(function() {
    chapter8VoiceAudio.pause();
    chapter8VoiceAudio.currentTime = 0;
  });
}

function playAudio(src) {
  return new Promise(function(resolve) {
    var token = ++chapter8VoiceToken;
    var finished = false;

    function finish() {
      if (finished || token !== chapter8VoiceToken) return;
      finished = true;
      chapter8VoiceAudio.onended = null;
      chapter8VoiceAudio.onerror = null;
      resolve();
    }

    chapter8VoiceAudio.pause();
    chapter8VoiceAudio.onended = finish;
    chapter8VoiceAudio.onerror = finish;
    chapter8VoiceAudio.src = src;
    chapter8VoiceAudio.currentTime = 0;
    chapter8VoiceAudio.volume = 0.7;
    chapter8VoiceAudio.load();

    var promise = chapter8VoiceAudio.play();
    if (promise && typeof promise.catch === 'function') {
      promise.catch(function(error) {
        console.error('오디오 재생 실패:', src, error);
        finish();
      });
    }
  });
}


function playAudioSeq(srcs) {
  if (!srcs || !srcs.length) return Promise.resolve();
  return playAudio(srcs[0]).then(function() {
    return playAudioSeq(srcs.slice(1));
  });
}

async function setPennerAudio(text, imgKey, audios) {
  setPenner(text, imgKey);
  if (audios && audios.length) playAudioSeq(audios);
}

function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}

var pennerImgTag = document.getElementById('penner-img-tag');
var pennerImgSpan = document.querySelector('#penner-image span');

function setPenner(text, imgKey){
  pennerBubble.textContent = text;
  if(imgKey){
    pennerImgTag.src = 'penner-images/' + imgKey + '.jpg';
    pennerImgTag.style.display = 'block';
    if(pennerImgSpan) pennerImgSpan.style.display = 'none';
  }
}

function setNarr(text){
  narrText.innerHTML = text.replace(/\n/g,'<br/>');
}

function showChoices(options){
  return new Promise(function(resolve){
    choicesDiv.innerHTML = '';
    document.getElementById('choices-panel').classList.add('show');
    options.forEach(function(opt, i){
      var btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = '💬 ' + opt.text;
      btn.onclick = function(){
        choicesDiv.innerHTML = '';
        document.getElementById('choices-panel').classList.remove('show');
        resolve(opt);
      };
      choicesDiv.appendChild(btn);
    });
  });
}

function clearChoices(){
  choicesDiv.innerHTML = '';
  document.getElementById('choices-panel').classList.remove('show');
}

function activateEvidence(keys){
  Object.keys(evidenceEls).forEach(function(k){
    evidenceEls[k].classList.remove('active');
  });
  keys.forEach(function(k){
    evidenceEls[k].classList.add('active');
  });
}

function waitForEvidence(correctKey){
  return new Promise(function(resolve){
    Object.keys(evidenceEls).forEach(function(k){
      var el = evidenceEls[k];
      if(!el.classList.contains('active')) return;
      el.onclick = function(){
        if(k === correctKey){
          Object.keys(evidenceEls).forEach(function(kk){
            evidenceEls[kk].onclick = null;
          });
          el.classList.remove('active');
          el.classList.add('used');
          resolve();
        } else {
          el.classList.add('wrong-shake');
          if(navigator.vibrate) navigator.vibrate(150);
          setTimeout(function(){ el.classList.remove('wrong-shake'); }, 350);
        }
      };
    });
  });
}

// 1라운드 — 오답 반응 매핑
var R1_WRONG = {
  '빨대파가 범인입니다': ['...빨대파요?', '아, 죄송합니다. 메모가 섞였네요.', 'p8_straw.mp3'],
  '여기 커피 맛있네요': ['지금 커피 얘기 하러 오신 겁니까?!', '아니, 진짜로 맛있어서요. 근데 그게 아니고...', 'p8_coffee.mp3']
};
var R2_WRONG = {
  'CCTV 화질이 좀 아쉽더군요': ['...지금 화질 얘기를 왜 하시는 겁니까?', '아, 그래도 알아볼 순 있었습니다.', 'p8_quality.mp3'],
  '경감님 닮은 묘가 꽤 있나봐요': ['그게 무슨...', '농담이고요. 본론은 이겁니다.', 'p8_whatmeans.mp3']
};
var R3_WRONG = {
  '그 자리에 유령이라도 있었던 걸까요': ['유, 유령이요?!', '비유입니다. 살아있는 유령이요.', 'p8_ghost.mp3'],
  '도플갱어라도 있나봐요': ['...', '어쩌면 맞는 말일 수도 있겠네요.', null]
};
var R4_WRONG = {
  '동료분들이 경감님 뒷담화를 좀 하시던데요': ['뭐, 뭐라고요?!', '아, 표현이 좀 거칠었네요. 다시 말씀드리죠.', 'p8_whatwhat.mp3'],
  '이 마을에서 꽤 오래 사셨더군요': ['그게 무슨 상관이오?', '오래 계셨으니 아는 것도 많으시겠죠.', 'p8_norel.mp3']
};
var R5_WRONG = {
  '아인이라는 묘를 아십니까?': ['모, 모르는 이름이오!', '방금 보여드린 대화 내용은 다른 분 일인가요?', 'p8_dontknow.mp3'],
  'Plan A가 뭔지 혹시 아세요?': ['...!', '아, 그건 이미 여쭤봤죠.', null]
};

async function pickChoice(options, correctText, wrongMap){
  var remaining = options.slice().sort(function(){ return Math.random() - 0.5; });
  while(true){
    var picked = await showChoices(remaining.map(function(t){return {text:t};}));
    if(picked.text === correctText){
      setNarr('탐정: "' + picked.text + '"');
      return;
    } else {
      remaining = remaining.filter(function(t){ return t !== picked.text; });
      setNarr('탐정: "' + picked.text + '"');
      await wait(600);
      var reactions = wrongMap[picked.text];
      setPenner(reactions[0]);
      if (reactions[2]) playAudio('dubbing/ch8/u/' + reactions[2]);
      await wait(1400);
      setNarr('탐정: "' + reactions[1] + '"');
      await wait(1600);
    }
  }
}

async function run(){
  setPennerAudio('무슨 용건인지나 말하시죠.', 'penner-relaxed', ['dubbing/ch8/u/p8_intro.mp3']);
  await wait(600);
  setNarr('탐정: "급하시긴. 그럼 바로 본론으로."');
  await wait(1200);

  // ===== 1라운드 — 장부 =====
  await pickChoice(
    ['S.T.R.A.W 장부라고 들어보셨습니까?', '빨대파가 범인입니다', '여기 커피 맛있네요'],
    'S.T.R.A.W 장부라고 들어보셨습니까?', R1_WRONG
  );
  await wait(1200);
  setPennerAudio('...잠복수사 중이었소.', 'penner-tense', ['dubbing/ch8/u/p8_undercover.mp3']);
  await wait(2400);
  setNarr('탐정: "아, 잠복수사요." (수첩 넘기는 척) "그렇군요.\n그런데 잠복수사 중에 누군가와 실거래를 하셨다는 게 좀 걸리는군요."');
  await wait(3300);

  promptText.style.display = 'block';
  promptText.textContent = '🔍 증거를 제출하세요';
  activateEvidence(['ledger']);
  await waitForEvidence('ledger');
  promptText.style.display = 'none';

  setPennerAudio('그건...!', 'penner-shocked', ['dubbing/ch8/u/p8_that.mp3']);
  await wait(2100);
  setNarr('탐정: "그날 그시간에 경감님은 근무중이셨으니, 거래하러 가실 수 없었을테니 말이죠."');
  await wait(3300);
  setPenner('...', 'penner-shocked');
  await wait(1500);
  setNarr('탐정: "그렇다면 그 자리에 있었던 건 누구였을까요."');
  await wait(3000);

  // ===== 2라운드 — 숙박리스트+CCTV+근무표 (통합) =====
  setNarr('탐정: "딜리셔스 호텔 9월 1일 체크인도 같은 경우겠군요."');
  await wait(3000);
  setPennerAudio('누명이오! 누군가 제 이름을 도용한 겁니다!', 'penner-angry', ['dubbing/ch8/u/p8_framed.mp3']);
  await wait(2700);
  setNarr('탐정: "도용." (메모하는 척) "흥미로운 표현이네요.\n딜리셔스 호텔 CCTV를 확인해봤는데 말이죠."');
  await wait(3300);

function goEnding(){
  if (window.RCMClear) { RCMClear.goFade('ENDING', 'ending.html'); return; }
  location.href = 'ending.html';
}

var chapter8Started = false;

function beginChapter8() {
  if (chapter8Started) return;
  chapter8Started = true;

  var gate = document.getElementById('audio-start-gate');
  var button = document.getElementById('audio-start-button');

  if (button) button.disabled = true;
  if (gate) gate.style.display = 'none';

  // BGM과 음성 권한은 같은 사용자 클릭 안에서 즉시 활성화
  try {
    var unlockPromise = unlockChapter8Audio();
    if (unlockPromise && typeof unlockPromise.catch === 'function') {
      unlockPromise.catch(function(error) {
        console.error('오디오 활성화 실패:', error);
      });
    }
  } catch (error) {
    console.error('오디오 활성화 오류:', error);
  }

  // 오디오 활성화 결과를 기다리지 않고 본문은 즉시 시작
  setTimeout(run, 100);
}

(function setupChapter8StartGate(){
  var button = document.getElementById('audio-start-button');
  if (!button) return;

  // 실제 button의 click 이벤트만 사용해 iPhone 중복 터치 충돌 방지
  button.onclick = beginChapter8;
})();
