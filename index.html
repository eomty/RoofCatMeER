<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>

<title>탐정X의 잠입수사</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#3a3835;font-family:'Noto Sans KR',sans-serif;}
body{min-height:100vh;max-width:420px;margin:0 auto;position:relative;display:flex;flex-direction:column;}

.tape{width:100%;background:#d4a800;color:#1a1410;font-size:9px;font-weight:700;letter-spacing:.25em;text-align:center;padding:8px 0;position:relative;z-index:10;flex-shrink:0;}

.stage{position:relative;flex:1;min-height:0;background:radial-gradient(ellipse at 50% 0%, #4a4742 0%, #2e2c29 70%);overflow:hidden;display:flex;flex-direction:column;}
.noise{position:absolute;inset:0;opacity:.05;background-image:radial-gradient(circle,#fff 1px,transparent 1px);background-size:6px 6px;}

.polaroid{position:absolute;background:#e8e4d8;padding:6px;box-shadow:2px 3px 8px rgba(0,0,0,.5);border-radius:1px;}
.polaroid img{display:block;width:100%;height:auto;object-fit:cover;}
.polaroid .strip{height:14px;background:#dcd8cc;margin-top:4px;}
.pin{position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7b7b,#a32d2d);box-shadow:0 1px 3px rgba(0,0,0,.5);z-index:5;}

.title-wrap{position:absolute;top:39.5%;left:0;right:0;text-align:center;z-index:3;}
.title-1{font-family:'Nanum Myeongjo',serif;font-size:38px;font-weight:800;color:#e8e4d8;letter-spacing:1px;text-shadow:2px 2px 0 rgba(0,0,0,.5);}
.title-1 .x{color:#c0392b;font-size:42px;}
.title-2{font-family:'Nanum Myeongjo',serif;font-size:44px;font-weight:800;color:#e8e4d8;letter-spacing:3px;text-shadow:2px 2px 0 rgba(0,0,0,.5);margin-top:6px;}

.file-tag{position:absolute;top:56.5%;left:50%;transform:translateX(-50%) rotate(-1deg);background:#e8e4d8;padding:8px 24px;font-family:'Nanum Myeongjo',serif;font-size:13px;color:#2a2620;box-shadow:1px 2px 4px rgba(0,0,0,.3);z-index:3;}

.redline{position:absolute;stroke:#a32d2d;stroke-width:1.2;opacity:.55;z-index:1;}

.footer{margin-top:auto;background:rgba(26,20,16,.92);padding:22px 24px;text-align:center;border-top:2px solid #d4a800;z-index:4;position:relative;}
.footer-sub{font-family:'Nanum Myeongjo',serif;font-size:14px;color:#c9a84c;letter-spacing:.5px;margin-bottom:10px;}
.footer-case{font-family:monospace;font-size:9px;color:#888;letter-spacing:1.5px;}

.start-btn{padding:18px;background:#8b1a1a;color:#f0e8d8;text-align:center;font-family:'Nanum Myeongjo',serif;font-size:15px;letter-spacing:.08em;border:none;width:100%;cursor:pointer;z-index:5;position:relative;flex-shrink:0;}
</style>
</head>
