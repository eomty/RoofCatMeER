<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>AR 단서 탐색</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.5/aframe/build/aframe-ar.js"></script>
<style>
* { margin:0; padding:0; }
body { overflow:hidden; }

#ui {
  position:fixed; bottom:0; left:0; right:0; z-index:999;
  background:rgba(0,0,0,0.6);
  padding:12px 18px 28px;
  font-family:sans-serif;
}
.back {
  position:fixed; top:16px; left:16px; z-index:999;
  background:rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.3);
  color:white; font-size:13px; padding:8px 16px; border-radius:20px;
  cursor:pointer;
}
.status {
  position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:999;
  background:rgba(0,0,0,0.6); border-radius:20px; padding:7px 16px;
  font-size:12px; color:white;
}
.clue-label { font-size:11px; color:rgba(255,255,255,0.4); margin-bottom:8px; }
#chips { display:flex; gap:8px; }
.chip {
  font-size:13px; padding:5px 14px; border-radius:20px;
  border:1px solid rgba(201,168,76,0.4);
  background:rgba(201,168,76,0.15); color:#c9a84c;
}

#popup {
  position:fixed; inset:0; z-index:9999;
  display:none; align-items:center; justify-content:center;
  pointer-events:none;
}
.popup-box {
  background:rgba(5,5,15,0.95); border:1px solid #c9a84c;
  border-radius:16px; padding:28px 40px; text-align:center;
  box-shadow:0 0 40px rgba(201,168,76,0.3);
}
.pop-label { font-size:11px; letter-spacing:0.2em; color:#c9a84c; margin-bottom:10px; }
.pop-word { font-size:42px; font-weight:700; margin-bottom:6px; }
.pop-desc { font-size:12px; color:rgba(255,255,255,0.5); }
</style>
</head>
<body>

<a-scene arjs="sourceType:webcam; debugUIEnabled:false;">
  <a-marker preset="hiro" id="m-hiro">
    <a-box position="0 0.5 0" color="#c9a84c"
      animation="property:rotation;to:0 360 0;loop:true;dur:3000;easing:linear">
    </a-box>
    <a-text value="루프" align="center" position="0 1.3 0" color="#ffffff" width="4"></a-text>
  </a-marker>
  <a-marker preset="kanji" id="m-kanji">
    <a-box position="0 0.5 0" color="#84c9e0"
      animation="property:rotation;to:0 360 0;loop:true;dur:2500;easing:linear">
    </a-box>
    <a-text value="탐험가" align="center" position="0 1.3 0" color="#ffffff" width="4"></a-text>
  </a-marker>
  <a-entity camera></a-entity>
</a-scene>

<button class="back" onclick="history.back()">← 돌아가기</button>
<div class="status" id="status">📷 문양을 찾는 중...</div>

<div id="popup">
  <div class="popup-box">
    <div class="pop-label">✦ 키워드 획득 ✦</div>
    <div class="pop-word" id="pop-word"></div>
    <div class="pop-desc" id="pop-desc"></div>
  </div>
</div>

<div id="ui">
  <div class="clue-label">획득한 단서</div>
  <div id="chips"><span style="color:rgba(255,255,255,0.2);font-size:13px;">아직 없음</span></div>
</div>

<script>
const MARKERS = {
  hiro:  { keyword:'루프',   desc:'첫 번째 단서 획득!', color:'#c9a84c' },
  kanji: { keyword:'탐험가', desc:'두 번째 단서 획득!', color:'#84c9e0' },
};
let found = [];
let timer = null;

function onFound(key) {
  document.getElementById('status').textContent = '✅ 인식됨!';
  const d = MARKERS[key];
  if (!found.includes(key)) {
    found.push(key);
    if (navigator.vibrate) navigator.vibrate([80,40,80]);
    const chips = document.getElementById('chips');
    if (chips.querySelector('span')) chips.innerHTML = '';
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = d.keyword;
    chip.style.color = d.color;
    chips.appendChild(chip);
  }
  document.getElementById('pop-word').textContent = d.keyword;
  document.getElementById('pop-word').style.color = d.color;
  document.getElementById('pop-desc').textContent = d.desc;
  document.getElementById('popup').style.display = 'flex';
  if (timer) clearTimeout(timer);
  timer = setTimeout(() => document.getElementById('popup').style.display = 'none', 2500);
}

function onLost() {
  document.getElementById('status').textContent = '📷 문양을 찾는 중...';
}

document.querySelector('a-scene').addEventListener('loaded', () => {
  document.getElementById('m-hiro').addEventListener('markerFound', () => onFound('hiro'));
  document.getElementById('m-hiro').addEventListener('markerLost', onLost);
  document.getElementById('m-kanji').addEventListener('markerFound', () => onFound('kanji'));
  document.getElementById('m-kanji').addEventListener('markerLost', onLost);
});
</script>
</body>
</html>
