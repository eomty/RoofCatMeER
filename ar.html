<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>AR 단서 탐색</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.5/aframe/build/aframe-ar.js"></script>
<style>
* { margin:0; padding:0; }
body { overflow:hidden; font-family:sans-serif; }
.back {
  position:fixed; top:16px; left:16px; z-index:999;
  background:rgba(0,0,0,0.7); border:1px solid rgba(255,255,255,0.3);
  color:white; font-size:13px; padding:8px 16px; border-radius:20px; cursor:pointer;
}
#status {
  position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:999;
  background:rgba(0,0,0,0.7); border-radius:20px; padding:8px 18px;
  font-size:13px; color:white; white-space:nowrap;
  border: 1px solid rgba(255,255,255,0.15);
}
/* 마커 인식됐을 때 화면 테두리 번쩍 */
#flash {
  position:fixed; inset:0; z-index:990;
  border: 6px solid #c9a84c;
  pointer-events:none; opacity:0;
  transition: opacity 0.1s;
}
#popup {
  position:fixed; inset:0; z-index:9999;
  display:none; align-items:center; justify-content:center;
  pointer-events:none;
}
.popup-box {
  background:rgba(5,5,15,0.96); border:2px solid #c9a84c;
  border-radius:20px; padding:32px 48px; text-align:center;
  box-shadow:0 0 60px rgba(201,168,76,0.4);
}
.pop-label { font-size:12px; letter-spacing:0.2em; color:#c9a84c; margin-bottom:12px; }
.pop-word { font-size:48px; font-weight:700; margin-bottom:8px; }
.pop-desc { font-size:13px; color:rgba(255,255,255,0.6); }
#ui {
  position:fixed; bottom:0; left:0; right:0; z-index:999;
  background:rgba(0,0,0,0.75); padding:14px 18px 30px;
}
.clue-label { font-size:11px; color:rgba(255,255,255,0.4); margin-bottom:8px; letter-spacing:0.1em; }
#chips { display:flex; gap:8px; flex-wrap:wrap; min-height:28px; }
.chip {
  font-size:13px; padding:5px 16px; border-radius:20px;
  border:1px solid rgba(201,168,76,0.5);
  background:rgba(201,168,76,0.15); color:#c9a84c;
}
/* 테스트 마커 안내 */
#test-guide {
  position:fixed; bottom:90px; left:0; right:0; z-index:999;
  display:flex; justify-content:center;
}
.test-inner {
  background:rgba(0,0,0,0.7); border:1px solid rgba(255,255,255,0.15);
  border-radius:10px; padding:8px 14px;
  display:flex; align-items:center; gap:10px;
  font-size:11px; color:rgba(255,255,255,0.6);
}
.test-inner img { width:40px; height:40px; border-radius:4px; }
</style>
</head>
<body>

<a-scene arjs="sourceType:webcam; debugUIEnabled:false;">

  <!-- 테스트용 Hiro 마커 (항상 작동함) -->
  <a-marker preset="hiro" id="m-test">
    <a-box position="0 0.5 0" color="#c9a84c"
      animation="property:rotation;to:0 360 0;loop:true;dur:2000;easing:linear">
    </a-box>
    <a-text value="루프" align="center" position="0 1.3 0" color="#fff" width="4"></a-text>
  </a-marker>

  <!-- 커스텀 마커 2: 탐험가 -->
  <a-marker type="pattern" url="pattern-marker2-explorer.patt" id="m2">
    <a-box position="0 0.5 0" color="#84c9e0"
      animation="property:rotation;to:0 360 0;loop:true;dur:2500;easing:linear">
    </a-box>
    <a-text value="탐험가" align="center" position="0 1.3 0" color="#fff" width="4"></a-text>
  </a-marker>

  <!-- 커스텀 마커 3: 여비 -->
  <a-marker type="pattern" url="pattern-marker3-yebi.patt" id="m3">
    <a-box position="0 0.5 0" color="#e084c9"
      animation="property:rotation;to:0 360 0;loop:true;dur:2000;easing:linear">
    </a-box>
    <a-text value="여비" align="center" position="0 1.3 0" color="#fff" width="4"></a-text>
  </a-marker>

  <!-- 커스텀 마커 4: 히든 -->
  <a-marker type="pattern" url="pattern-marker4-hidden.patt" id="m4">
    <a-box position="0 0.5 0" color="#4caf82"
      animation="property:rotation;to:0 360 0;loop:true;dur:3000;easing:linear">
    </a-box>
    <a-text value="???" align="center" position="0 1.3 0" color="#fff" width="4"></a-text>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<button class="back" onclick="history.back()">← 돌아가기</button>
<div id="status">📷 문양을 찾는 중...</div>
<div id="flash"></div>

<div id="test-guide">
  <div class="test-inner">
    <img src="https://ar-js-org.github.io/AR.js/data/images/HIRO.jpg" alt="hiro"/>
    <span>Hiro 마커로 먼저 테스트 해보세요</span>
  </div>
</div>

<div id="popup">
  <div class="popup-box">
    <div class="pop-label">✦ 키워드 획득 ✦</div>
    <div class="pop-word" id="pop-word"></div>
    <div class="pop-desc" id="pop-desc"></div>
  </div>
</div>

<div id="ui">
  <div class="clue-label">획득한 단서</div>
  <div id="chips"><span style="color:rgba(255,255,255,0.2);font-size:13px;">아직 없음</span></div>
</div>

<script>
const MARKERS = {
  'hiro':  { keyword:'루프',   desc:'첫 번째 단서 획득!', color:'#c9a84c' },
  'm2':    { keyword:'탐험가', desc:'두 번째 단서 획득!', color:'#84c9e0' },
  'm3':    { keyword:'여비',   desc:'세 번째 단서 획득!', color:'#e084c9' },
  'm4':    { keyword:'???',   desc:'히든 단서 획득...!', color:'#4caf82' },
};
let found = [];
let timer = null;

function onFound(key) {
  const d = MARKERS[key];
  if (!d) return;

  // 화면 테두리 번쩍
  const flash = document.getElementById('flash');
  flash.style.borderColor = d.color;
  flash.style.opacity = '1';
  setTimeout(() => flash.style.opacity = '0', 300);

  document.getElementById('status').textContent = '✅ 인식됨! — ' + d.keyword;
  document.getElementById('test-guide').style.display = 'none';

  if (!found.includes(key)) {
    found.push(key);
    if (navigator.vibrate) navigator.vibrate([80,40,80]);
    const chips = document.getElementById('chips');
    if (chips.querySelector('span')) chips.innerHTML = '';
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = d.keyword;
    chip.style.color = d.color;
    chips.appendChild(chip);
    try { localStorage.setItem('loopcat_clues', JSON.stringify(found)); } catch(e){}
  }

  document.getElementById('pop-word').textContent = d.keyword;
  document.getElementById('pop-word').style.color = d.color;
  document.getElementById('pop-desc').textContent = d.desc;
  document.getElementById('popup').style.display = 'flex';
  if (timer) clearTimeout(timer);
  timer = setTimeout(() => document.getElementById('popup').style.display = 'none', 2500);
}

function onLost() {
  document.getElementById('status').textContent = '📷 문양을 찾는 중...';
}

document.querySelector('a-scene').addEventListener('loaded', () => {
  const mTest = document.getElementById('m-test');
  if (mTest) {
    mTest.addEventListener('markerFound', () => onFound('hiro'));
    mTest.addEventListener('markerLost', onLost);
  }
  ['m2','m3','m4'].forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.addEventListener('markerFound', () => onFound(id));
      el.addEventListener('markerLost', onLost);
    }
  });
});
</script>
</body>
</html>
