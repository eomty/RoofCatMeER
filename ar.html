<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>AR 단서 탐색</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.5/aframe/build/aframe-ar.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{overflow:hidden;font-family:sans-serif;background:#000;}

/* 상단 HUD */
#hud-top{
  position:fixed;top:0;left:0;right:0;z-index:999;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;
  background:linear-gradient(to bottom,rgba(0,0,0,0.8),transparent);
}
.ar-status{display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(255,255,255,0.7);}
.pulse{width:8px;height:8px;border-radius:50%;background:#ef4444;}
.pulse.on{background:#22c55e;}
.back-btn{
  background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.2);
  color:white;font-size:13px;padding:7px 14px;border-radius:20px;cursor:pointer;
}

/* 어두운 오버레이 + 중앙 구역 */
#overlay{position:fixed;inset:0;z-index:50;pointer-events:none;}
.ov-top{position:absolute;top:0;left:0;right:0;height:22%;background:rgba(0,0,0,0.6);}
.ov-bottom{position:absolute;bottom:0;left:0;right:0;height:30%;background:rgba(0,0,0,0.6);}
.ov-left{position:absolute;top:22%;bottom:30%;left:0;width:8%;background:rgba(0,0,0,0.6);}
.ov-right{position:absolute;top:22%;bottom:30%;right:0;width:8%;background:rgba(0,0,0,0.6);}

/* 스캔 프레임 모서리 */
#scan-frame{
  position:fixed;
  top:22%;left:8%;right:8%;
  height:48%;
  z-index:51;pointer-events:none;
}
.corner{position:absolute;width:28px;height:28px;}
.corner.tl{top:0;left:0;border-top:3px solid #c9a84c;border-left:3px solid #c9a84c;border-radius:2px 0 0 0;}
.corner.tr{top:0;right:0;border-top:3px solid #c9a84c;border-right:3px solid #c9a84c;border-radius:0 2px 0 0;}
.corner.bl{bottom:0;left:0;border-bottom:3px solid #c9a84c;border-left:3px solid #c9a84c;border-radius:0 0 0 2px;}
.corner.br{bottom:0;right:0;border-bottom:3px solid #c9a84c;border-right:3px solid #c9a84c;border-radius:0 0 2px 0;}

/* 인식됐을 때 초록 글로우 */
#scan-frame.found .corner{
  border-color:#22c55e;
  filter:drop-shadow(0 0 6px #22c55e);
  animation:glow 0.8s ease-in-out infinite alternate;
}
@keyframes glow{
  from{filter:drop-shadow(0 0 4px #22c55e);}
  to{filter:drop-shadow(0 0 14px #22c55e);}
}

/* 스캔 라인 */
#scan-line{
  position:absolute;left:0;right:0;top:0;height:2px;
  background:linear-gradient(to right,transparent,#c9a84c,transparent);
  animation:scanning 2.5s ease-in-out infinite;
  opacity:0.7;
}
#scan-frame.found #scan-line{
  background:linear-gradient(to right,transparent,#22c55e,transparent);
}
@keyframes scanning{0%,100%{top:0;opacity:0}10%,90%{opacity:0.8}50%{top:calc(100% - 2px)}}

/* 키워드 팝업 */
#popup{
  position:fixed;inset:0;z-index:9999;
  display:none;align-items:center;justify-content:center;
  pointer-events:none;
}
.popup-box{
  background:rgba(5,5,15,0.96);border:2px solid #c9a84c;
  border-radius:20px;padding:28px 40px;text-align:center;
  box-shadow:0 0 50px rgba(201,168,76,0.3);
}
.pop-label{font-size:11px;letter-spacing:0.2em;color:#c9a84c;margin-bottom:10px;}
.pop-word{font-size:40px;font-weight:700;margin-bottom:6px;color:white;}
.pop-desc{font-size:12px;color:rgba(255,255,255,0.5);}

/* 하단 단서 */
#hud-bottom{
  position:fixed;bottom:0;left:0;right:0;z-index:999;
  padding:12px 18px 28px;
  background:linear-gradient(to top,rgba(0,0,0,0.85),transparent);
}
.clue-label{font-size:10px;letter-spacing:0.15em;color:rgba(255,255,255,0.35);margin-bottom:8px;}
#chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{font-size:13px;padding:5px 16px;border-radius:20px;border:1px solid rgba(201,168,76,0.5);background:rgba(201,168,76,0.15);color:#c9a84c;}
</style>
</head>
<body>
<script src="debug-config.js"></script>
<script src="flow-guard.js"></script>

<a-scene arjs="sourceType:webcam; debugUIEnabled:false;">
  <a-marker preset="hiro" id="m-hiro">
    <a-box position="0 0.5 0" color="#c9a84c" animation="property:rotation;to:0 360 0;loop:true;dur:2000;easing:linear"></a-box>
    <a-text value="루프" align="center" position="0 1.3 0" color="#fff" width="4"></a-text>
  </a-marker>
  <a-marker type="pattern" url="pattern-nkk.patt" id="m-nkk">
    <a-box position="0 0.5 0" color="#f0c040" animation="property:rotation;to:0 360 0;loop:true;dur:2000;easing:linear"></a-box>
    <a-text value="하얀손" align="center" position="0 1.3 0" color="#fff" width="4"></a-text>
  </a-marker>
  <a-entity camera></a-entity>
</a-scene>

<!-- HUD 상단 -->
<div id="hud-top">
  <div class="ar-status">
    <span class="pulse" id="pulse"></span>
    <span id="status-text">문양을 찾는 중...</span>
  </div>
  <button class="back-btn" onclick="history.back()">← 돌아가기</button>
</div>

<!-- 오버레이 + 프레임 -->
<div id="overlay">
  <div class="ov-top"></div>
  <div class="ov-bottom"></div>
  <div class="ov-left"></div>
  <div class="ov-right"></div>
</div>

<div id="scan-frame">
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
  <div id="scan-line"></div>
</div>

<!-- 키워드 팝업 -->
<div id="popup">
  <div class="popup-box">
    <div class="pop-label">✦ 단서 획득 ✦</div>
    <div class="pop-word" id="pop-word"></div>
    <div class="pop-desc" id="pop-desc"></div>
  </div>
</div>

<!-- 하단 단서 -->
<div id="hud-bottom">
  <div class="clue-label">획득한 단서</div>
  <div id="chips"><span style="color:rgba(255,255,255,0.2);font-size:13px;">아직 없음</span></div>
</div>

<script>
var MARKERS = {
  hiro: {keyword:'루프', desc:'단서를 획득했습니다!', color:'#c9a84c', next:null},
  nkk:  {keyword:'하얀손', desc:'타짜의 증거물을 획득했습니다!', color:'#f0c040', next:'chapter2-unlocked.html'},
};
var found = [];
var timer = null;

function onFound(key) {
  var d = MARKERS[key];
  if (!d) return;

  // 프레임 초록 글로우
  document.getElementById('scan-frame').classList.add('found');
  document.getElementById('pulse').classList.add('on');
  document.getElementById('status-text').textContent = '✅ 인식됨!';
  if (navigator.vibrate) navigator.vibrate([80,40,80]);

  if (!found.includes(key)) {
    found.push(key);
    var chips = document.getElementById('chips');
    if (chips.querySelector('span')) chips.innerHTML = '';
    var chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = d.keyword;
    chip.style.color = d.color;
    chips.appendChild(chip);
    try {
      var clues = JSON.parse(localStorage.getItem('loopcat_clues') || '[]');
      clues.push(d.keyword);
      localStorage.setItem('loopcat_clues', JSON.stringify(clues));
    } catch(e) {}
  }

  document.getElementById('pop-word').textContent = d.keyword;
  document.getElementById('pop-word').style.color = d.color;
  document.getElementById('pop-desc').textContent = d.desc;
  document.getElementById('popup').style.display = 'flex';
  if (timer) clearTimeout(timer);
  if (d.next) {
    timer = setTimeout(function() {
      document.getElementById('popup').style.display = 'none';
      if (window.RCMFlow) RCMFlow.markComplete('chapter2.html');
      location.href = d.next;
    }, 2500);
  } else {
    timer = setTimeout(function() {
      document.getElementById('popup').style.display = 'none';
    }, 2500);
  }
}

function onLost() {
  document.getElementById('scan-frame').classList.remove('found');
  document.getElementById('pulse').classList.remove('on');
  document.getElementById('status-text').textContent = '문양을 찾는 중...';
}

document.querySelector('a-scene').addEventListener('loaded', function() {
  var mHiro = document.getElementById('m-hiro');
  if (mHiro) {
    mHiro.addEventListener('markerFound', function() { onFound('hiro'); });
    mHiro.addEventListener('markerLost', onLost);
  }
  var mNkk = document.getElementById('m-nkk');
  if (mNkk) {
    mNkk.addEventListener('markerFound', function() { onFound('nkk'); });
    mNkk.addEventListener('markerLost', onLost);
  }
});
</script>
</body>
</html>
