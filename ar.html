<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>AR 단서 탐색</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{overflow:hidden;font-family:sans-serif;background:#000;}

#hud-top{
  position:fixed;top:0;left:0;right:0;z-index:999;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;
  background:linear-gradient(to bottom,rgba(0,0,0,0.8),transparent);
}
.ar-status{display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(255,255,255,0.7);}
.pulse{width:8px;height:8px;border-radius:50%;background:#ef4444;transition:background .3s;}
.pulse.on{background:#22c55e;}
.back-btn{
  background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.2);
  color:white;font-size:13px;padding:7px 14px;border-radius:20px;cursor:pointer;
}




#popup{
  position:fixed;inset:0;z-index:2147483647;
  display:none;align-items:center;justify-content:center;
  pointer-events:none;
}
.popup-box{
  background:rgba(5,5,15,0.96);border:2px solid #c9a84c;
  border-radius:20px;padding:28px 40px;text-align:center;
  box-shadow:0 0 50px rgba(201,168,76,0.3);
  position:relative;z-index:2147483647;
}
.pop-label{font-size:11px;letter-spacing:0.2em;color:#c9a84c;margin-bottom:10px;}
.pop-word{font-size:40px;font-weight:700;margin-bottom:6px;color:white;}
.pop-desc{font-size:12px;color:rgba(255,255,255,0.5);}

#hud-bottom{
  position:fixed;bottom:0;left:0;right:0;z-index:999;
  padding:12px 18px 28px;
  background:linear-gradient(to top,rgba(0,0,0,0.85),transparent);
}
.clue-label{font-size:10px;letter-spacing:0.15em;color:rgba(255,255,255,0.35);margin-bottom:8px;}
#chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{font-size:13px;padding:5px 16px;border-radius:20px;border:1px solid rgba(201,168,76,0.5);background:rgba(201,168,76,0.15);color:#c9a84c;}
</style>
</head>
<body>
<script src="debug-config.js"></script>
<script src="flow-guard.js"></script>

<!-- MindAR Scene -->
<a-scene
  mindar-image="imageTargetSrc: targets.mind; autoStart: true;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <!-- 11개 이미지 타겟 전부 감지 -->
  <a-entity mindar-image-target="targetIndex: 0"  id="t0"></a-entity>
  <a-entity mindar-image-target="targetIndex: 1"  id="t1"></a-entity>
  <a-entity mindar-image-target="targetIndex: 2"  id="t2"></a-entity>
  <a-entity mindar-image-target="targetIndex: 3"  id="t3"></a-entity>
  <a-entity mindar-image-target="targetIndex: 4"  id="t4"></a-entity>
  <a-entity mindar-image-target="targetIndex: 5"  id="t5"></a-entity>
  <a-entity mindar-image-target="targetIndex: 6"  id="t6"></a-entity>
  <a-entity mindar-image-target="targetIndex: 7"  id="t7"></a-entity>
  <a-entity mindar-image-target="targetIndex: 8"  id="t8"></a-entity>
  <a-entity mindar-image-target="targetIndex: 9"  id="t9"></a-entity>
  <a-entity mindar-image-target="targetIndex: 10" id="t10"></a-entity>
</a-scene>

<!-- HUD -->
<div id="hud-top">
  <div class="ar-status">
    <span class="pulse" id="pulse"></span>
    <span id="status-text">낑깡이를 찾는 중...</span>
  </div>
  <button class="back-btn" onclick="history.back()">← 돌아가기</button>
</div>



<div id="popup">
  <div class="popup-box">
    <div class="pop-label">✦ 단서 획득 ✦</div>
    <div class="pop-word" id="pop-word"></div>
    <div class="pop-desc" id="pop-desc"></div>
  </div>
</div>

<div id="hud-bottom">
  <div class="clue-label">획득한 단서</div>
  <div id="chips"><span style="color:rgba(255,255,255,0.2);font-size:13px;">아직 없음</span></div>
</div>

<script>
(function () {
  var clueFound = false;
  var redirectTimer = null;
  var eventsBound = false;

  function showClue() {
    console.log('[AR] showClue 실행');
    var pulse = document.getElementById('pulse');
    var statusText = document.getElementById('status-text');
    var chips = document.getElementById('chips');
    var popup = document.getElementById('popup');
    var popWord = document.getElementById('pop-word');
    var popDesc = document.getElementById('pop-desc');

    if (!pulse || !statusText || !chips || !popup || !popWord || !popDesc) {
      console.error('[AR] 필요한 HTML 요소를 찾지 못했습니다.');
      return;
    }

    pulse.classList.add('on');
    statusText.textContent = '✅ 낑깡이 인식됨!';
    if (navigator.vibrate) navigator.vibrate([80, 40, 80]);

    if (clueFound) return;
    clueFound = true;
    unbindTargetEvents();

    chips.innerHTML = '<span class="chip">하얀손</span>';
    try {
      var savedClues = JSON.parse(localStorage.getItem('loopcat_clues') || '[]');
      if (!Array.isArray(savedClues)) savedClues = [];
      if (savedClues.indexOf('하얀손') === -1) savedClues.push('하얀손');
      localStorage.setItem('loopcat_clues', JSON.stringify(savedClues));
    } catch (error) { console.error('[AR] 단서 저장 실패:', error); }

    popWord.textContent = '하얀손';
    popDesc.textContent = '타짜의 증거물을 획득했습니다!';
    popup.style.display = 'flex';
    popup.style.visibility = 'visible';
    popup.style.opacity = '1';
    console.log('[AR] 팝업 표시 완료');

    if (redirectTimer) clearTimeout(redirectTimer);
    redirectTimer = setTimeout(function () {
      popup.style.display = 'none';
      try {
        if (window.RCMFlow && typeof window.RCMFlow.markComplete === 'function') {
          window.RCMFlow.markComplete('chapter2.html');
        }
      } catch (error) { console.error('[AR] 진행 상태 저장 실패:', error); }
      window.location.href = 'chapter2-unlocked.html';
    }, 2500);
  }

  function hideDetectionStatus() {
    var pulse = document.getElementById('pulse');
    var statusText = document.getElementById('status-text');
    if (pulse) pulse.classList.remove('on');
    if (statusText && !clueFound) statusText.textContent = '낑깡이를 찾는 중...';
  }

  function bindTargetEvents() {
    if (eventsBound) return;
    var boundCount = 0;
    for (var i = 0; i <= 10; i++) {
      var target = document.getElementById('t' + i);
      if (!target) { console.warn('[AR] 타겟 요소 없음: t' + i); continue; }
      target.addEventListener('targetFound', showClue);
      target.addEventListener('targetLost', hideDetectionStatus);
      boundCount++;
    }
    if (boundCount > 0) {
      eventsBound = true;
      console.log('[AR] 타겟 이벤트 연결 완료:', boundCount);
    } else {
      console.error('[AR] 연결된 이미지 타겟이 없습니다.');
    }
  }

  function unbindTargetEvents() {
    for (var i = 0; i <= 10; i++) {
      var target = document.getElementById('t' + i);
      if (!target) continue;
      target.removeEventListener('targetFound', showClue);
      target.removeEventListener('targetLost', hideDetectionStatus);
    }
    console.log('[AR] 타겟 이벤트 해제 완료');
  }

  function initializeAREvents() {
    var scene = document.querySelector('a-scene');
    if (!scene) { console.error('[AR] a-scene을 찾지 못했습니다.'); return; }
    if (scene.hasLoaded) { bindTargetEvents(); return; }
    scene.addEventListener('loaded', bindTargetEvents, { once: true });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initializeAREvents, { once: true });
  } else {
    initializeAREvents();
  }
})();
</script>
</body>
</html>
