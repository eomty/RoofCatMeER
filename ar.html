<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>AR 단서 탐색</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.5/aframe/build/aframe-ar.js"></script>
<style>
* { margin:0; padding:0; }
body { overflow:hidden; font-family:sans-serif; }
.back {
  position:fixed; top:16px; left:16px; z-index:999;
  background:rgba(0,0,0,0.7); border:1px solid rgba(255,255,255,0.3);
  color:white; font-size:13px; padding:8px 16px; border-radius:20px; cursor:pointer;
}
#status {
  position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:999;
  background:rgba(0,0,0,0.7); border-radius:20px; padding:8px 18px;
  font-size:13px; color:white; white-space:nowrap;
  border:1px solid rgba(255,255,255,0.15);
}
#flash {
  position:fixed; inset:0; z-index:990;
  border:6px solid #f0c040;
  pointer-events:none; opacity:0;
  transition:opacity 0.15s;
}
#popup {
  position:fixed; inset:0; z-index:9999;
  display:none; align-items:center; justify-content:center;
  pointer-events:none;
}
.popup-box {
  background:rgba(5,5,15,0.96); border:2px solid #c9a84c;
  border-radius:20px; padding:32px 48px; text-align:center;
  box-shadow:0 0 60px rgba(201,168,76,0.4);
}
.pop-label { font-size:12px; letter-spacing:0.2em; color:#c9a84c; margin-bottom:12px; }
.pop-word { font-size:42px; font-weight:700; margin-bottom:8px; color:white; }
.pop-desc { font-size:12px; color:rgba(255,255,255,0.5); }
#ui {
  position:fixed; bottom:0; left:0; right:0; z-index:999;
  background:rgba(0,0,0,0.75); padding:14px 18px 30px;
}
.clue-label { font-size:11px; color:rgba(255,255,255,0.4); margin-bottom:8px; }
#chips { display:flex; gap:8px; flex-wrap:wrap; }
.chip {
  font-size:13px; padding:5px 16px; border-radius:20px;
  border:1px solid rgba(201,168,76,0.5);
  background:rgba(201,168,76,0.15); color:#c9a84c;
}
#hint-guide {
  position:fixed; bottom:90px; left:0; right:0; z-index:999;
  display:flex; justify-content:center;
}
.hint-inner {
  background:rgba(0,0,0,0.7); border:1px solid rgba(255,255,255,0.15);
  border-radius:10px; padding:8px 14px;
  display:flex; align-items:center; gap:10px;
  font-size:11px; color:rgba(255,255,255,0.6);
}
.hint-inner img { width:44px; height:44px; border-radius:6px; object-fit:cover; }
</style>
</head>
<body>

<a-scene arjs="sourceType:webcam; debugUIEnabled:false;">

  <!-- Hiro 테스트 마커 -->
  <a-marker preset="hiro" id="m-hiro">
    <a-box position="0 0.5 0" color="#c9a84c"
      animation="property:rotation;to:0 360 0;loop:true;dur:2000;easing:linear">
    </a-box>
    <a-text value="루프" align="center" position="0 1.3 0" color="#fff" width="4"></a-text>
  </a-marker>

  <!-- 낑깡 커스텀 마커 -->
  <a-marker type="pattern" url="pattern-nkk-marker.patt" id="m-nkk">
    <a-box position="0 0.5 0" color="#f0c040"
      animation="property:rotation;to:0 360 0;loop:true;dur:2000;easing:linear">
    </a-box>
    <a-text value="하얀손" align="center" position="0 1.3 0" color="#fff" width="4"></a-text>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<div id="popup">
  <div class="popup-box">
    <div class="pop-label">✦ 증거물 획득 ✦</div>
    <div class="pop-word" id="pop-word"></div>
    <div class="pop-desc" id="pop-desc"></div>
  </div>
</div>

<div id="ui">
  <div class="clue-label">획득한 단서</div>
  <div id="chips"><span style="color:rgba(255,255,255,0.2);font-size:13px;">아직 없음</span></div>
</div>

<script>
const MARKERS = {
  hiro: { keyword:'루프', desc:'단서를 획득했습니다!', color:'#c9a84c', next: null },
  nkk:  { keyword:'하얀손', desc:'타짜의 증거물을 획득했습니다!', color:'#f0c040', next: 'chapter2-unlocked.html' },
};
let found = [];
let timer = null;

function onFound(key) {
  const d = MARKERS[key];
  if (!d) return;
  document.getElementById('status').textContent = '✅ 인식됨! — ' + d.keyword;
  const flash = document.getElementById('flash');
  flash.style.borderColor = d.color;
  flash.style.opacity = '1';
  setTimeout(() => flash.style.opacity = '0', 300);

  if (!found.includes(key)) {
    found.push(key);
    if (navigator.vibrate) navigator.vibrate([80,40,80]);
    const chips = document.getElementById('chips');
    if (chips.querySelector('span')) chips.innerHTML = '';
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = d.keyword;
    chip.style.color = d.color;
    chips.appendChild(chip);
    try {
      const clues = JSON.parse(localStorage.getItem('loopcat_clues') || '[]');
      clues.push(d.keyword);
      localStorage.setItem('loopcat_clues', JSON.stringify(clues));
    } catch(e) {}
  }

  document.getElementById('pop-word').textContent = d.keyword;
  document.getElementById('pop-word').style.color = d.color;
  document.getElementById('pop-desc').textContent = d.desc;
  document.getElementById('popup').style.display = 'flex';
  if (timer) clearTimeout(timer);
  if (d.next) {
    timer = setTimeout(() => {
      document.getElementById('popup').style.display = 'none';
      location.href = d.next;
    }, 2500);
  } else {
    timer = setTimeout(() => document.getElementById('popup').style.display = 'none', 2500);
  }
}

function onLost() {
  document.getElementById('status').textContent = '📷 마커를 찾는 중...';
}

document.querySelector('a-scene').addEventListener('loaded', () => {
  const mHiro = document.getElementById('m-hiro');
  if (mHiro) {
    mHiro.addEventListener('markerFound', () => onFound('hiro'));
    mHiro.addEventListener('markerLost', onLost);
  }
  const mNkk = document.getElementById('m-nkk');
  if (mNkk) {
    mNkk.addEventListener('markerFound', () => onFound('nkk'));
    mNkk.addEventListener('markerLost', onLost);
  }
});
</script>
