<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>낑깡이와 대화</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1410;font-family:'Noto Sans KR',sans-serif;}
#wrap{display:flex;flex-direction:column;height:100vh;height:100svh;max-width:480px;margin:0 auto;}
.header{background:#12121a;border-bottom:1px solid rgba(255,255,255,.08);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.back-btn{background:none;border:none;color:rgba(255,255,255,.6);font-size:20px;cursor:pointer;padding:0 8px 0 0;}
.avatar{width:40px;height:40px;border-radius:50%;overflow:hidden;border:2px solid #c9a84c;flex-shrink:0;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.name{font-size:15px;font-weight:500;color:#fff;}
.status{font-size:11px;color:rgba(255,255,255,.35);}
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;}
.msg{max-width:78%;display:flex;flex-direction:column;gap:3px;}
.msg.them{align-self:flex-start;}
.msg.me{align-self:flex-end;}
.bubble{padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.7;}
.msg.them .bubble{background:#1e1e2e;border:1px solid rgba(255,255,255,.08);border-radius:4px 16px 16px 16px;color:#e8e0d0;}
.msg.me .bubble{background:rgba(201,168,76,.2);border:1px solid rgba(201,168,76,.25);border-radius:16px 4px 16px 16px;color:#e8e0d0;}
.time{font-size:10px;color:rgba(255,255,255,.2);}
.msg.me .time{text-align:right;}
.typing{display:flex;gap:4px;padding:12px 14px;align-items:center;}
.typing span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4);animation:t 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}
@keyframes t{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:4px;align-self:stretch;}
.choice{padding:11px 16px;background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.3);border-radius:22px;color:#c9a84c;font-size:13px;font-family:'Noto Sans KR',sans-serif;text-align:left;cursor:pointer;transition:all .2s;line-height:1.5;}
.choice:active{background:rgba(201,168,76,.2);}
.next-btn{width:100%;padding:14px;margin-top:8px;background:#8b1a1a;color:#f0e8d8;font-size:15px;border:none;border-radius:4px;cursor:pointer;display:none;}
.input-area{background:#12121a;border-top:1px solid rgba(255,255,255,.08);padding:10px 12px calc(10px + env(safe-area-inset-bottom)) 12px;display:flex;gap:8px;align-items:center;flex-shrink:0;}
.input{flex:1;background:#1e1e2e;border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:10px 16px;font-size:14px;color:#e8e0d0;font-family:'Noto Sans KR',sans-serif;outline:none;}
.input::placeholder{color:rgba(255,255,255,.25);}
.send{width:40px;height:40px;border-radius:50%;background:rgba(201,168,76,.2);border:1px solid rgba(201,168,76,.3);color:#c9a84c;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
</style>
</head>

function rand(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function getTime() {
  var d = new Date();
  return d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0');
}

function addMsg(who, text) {
  var msgs = document.getElementById('msgs');
  var d = document.createElement('div');
  d.className = 'msg ' + who;
  d.innerHTML = '<div class="bubble">' + text.replace(/\n/g,'<br/>') + '</div><div class="time">' + getTime() + '</div>';

  msgs.scrollTop = msgs.scrollHeight;
  return d;
}

function addTyping() {
  var msgs = document.getElementById('msgs');

function removeChoices() {
  var old = document.getElementById('choices-div');

  removeChoices();

      var msgs = document.getElementById('msgs');
      var nb = document.createElement('button');
      nb.className = 'next-btn';
      nb.style.display = 'block';
      nb.textContent = '캣렉사무소 전단지 찾으러 가기 →';
      nb.onclick = function() { location.href = 'chapter3.html'; };
      msgs.appendChild(nb);
      msgs.scrollTop = msgs.scrollHeight;
      return;
    }
    if (q1Done && q2Done) {
      setTimeout(function() {
        var t2 = addTyping();
        setTimeout(function() {
          t2.remove();
          addMsg('them', '...그리고 한 가지 더 알려줄게.');
          setTimeout(showFinalChoice, 500);
        }, 1000);
      }, 600);
    } else {
      setTimeout(showChoices, 500);
    }
  }, 1200);
}

function sendMsg() {
  var inp = document.getElementById('inp');
  var text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  addMsg('me', text);

  if (!passwordEntered) {
    if (text === '하얀손') {
      passwordEntered = true;
      var t = addTyping();
      setTimeout(function() {
        t.remove();
        addMsg('them', '...하얀손의 소개라면 얘기가 다르지.\n뭘 알고 싶은 거요?');
        inp.placeholder = '선택지를 눌러 대화하세요';
        inp.disabled = true;
        document.getElementById('send-btn').disabled = true;
        setTimeout(showChoices, 600);
      }, 1200);
    } else {
      var t = addTyping();
      setTimeout(function() {
        t.remove();
        addMsg('them', rand(BEFORE));
      }, 700);
    }
  } else {
    // 선택지 외 자유입력
    var t = addTyping();
    setTimeout(function() {
      t.remove();
      addMsg('them', rand(AFTER));
    }, 700);
  }
}

document.getElementById('send-btn').onclick = sendMsg;
document.getElementById('inp').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') sendMsg();
});
</script>
</body>
</html>
