<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
  <title>로그인 · 탐정X의 잠입수사</title>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{
      background:#3a3835;
      font-family:'Noto Sans KR',sans-serif;
      min-height:100vh;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
    }
    .tape{
      width:100%;background:#d4a800;color:#1a1410;
      font-size:9px;font-weight:700;letter-spacing:.25em;text-align:center;
      padding:8px 0;position:fixed;top:0;left:0;z-index:10;
    }
    .card{
      background:#1e1c1a;border:1px solid #4a4742;
      padding:40px 32px;border-radius:4px;
      max-width:340px;width:90%;text-align:center;
      box-shadow:0 8px 32px rgba(0,0,0,.6);
      margin-top:32px;
    }
    .case-label{
      font-size:10px;letter-spacing:.25em;color:#d4a800;
      text-transform:uppercase;margin-bottom:16px;
    }
    .title{
      font-family:'Nanum Myeongjo',serif;font-size:22px;font-weight:800;
      color:#e8e4d8;letter-spacing:1px;margin-bottom:8px;
    }
    .sub{
      font-size:12px;color:#888;margin-bottom:32px;line-height:1.6;
    }
    .google-btn{
      display:flex;align-items:center;justify-content:center;gap:12px;
      width:100%;padding:14px;border:none;border-radius:2px;
      background:#fff;color:#3c3c3c;font-size:14px;font-weight:500;
      cursor:pointer;transition:background .15s;
    }
    .google-btn:hover{background:#f5f5f5;}
    .google-btn:active{background:#eee;}
    .google-btn svg{flex-shrink:0;}
    .status{
      margin-top:20px;font-size:12px;color:#888;min-height:18px;
    }
    .status.error{color:#e06c6c;}
    .divider{
      border:none;border-top:1px solid #333;margin:24px 0;
    }
    .back-link{
      font-size:11px;color:#666;text-decoration:none;
      display:block;margin-top:16px;
    }
    .back-link:hover{color:#888;}
    .spinner{
      display:inline-block;width:14px;height:14px;
      border:2px solid #555;border-top-color:#d4a800;
      border-radius:50%;animation:spin .7s linear infinite;
      vertical-align:middle;margin-right:6px;
    }
    @keyframes spin{to{transform:rotate(360deg);}}
  </style>
</head>
<body>
<div class="tape">POLICE LINE DO NOT CROSS · POLICE LINE DO NOT CROSS</div>

<div class="card">
  <div class="case-label">루프캣미 방탈출</div>
  <div class="title">탐정X의 잠입수사</div>
  <p class="sub">플레이하려면 구글 계정으로 로그인이 필요합니다.<br>로그인 후 자동으로 시작 화면으로 이동합니다.</p>

  <button class="google-btn" id="loginBtn" onclick="signInWithGoogle()">
    <svg width="18" height="18" viewBox="0 0 18 18">
      <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
      <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
      <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
      <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"/>
    </svg>
    Google로 로그인
  </button>

  <div class="status" id="statusMsg"></div>
</div>

<!-- Firebase App + Auth -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged }
    from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';

  // ★ Firebase 콘솔 → 프로젝트 설정 → 내 앱 → SDK 설정에서 복사
  const firebaseConfig = {
    apiKey:            "AIzaSyBqxMZf8xDfaQ1oAheXJAuYbWBBfZBkgvI",
    authDomain:        "roofcatmeplay.firebaseapp.com",
    databaseURL:       "https://roofcatmeer-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:         "roofcatmeplay",
    storageBucket:     "roofcatmeplay.firebasestorage.app",
    messagingSenderId: "793320259272",
    appId:             "1:793320259272:web:7ba8355067b03edc2b2ffd"
  };

  const app      = initializeApp(firebaseConfig);
  const auth     = getAuth(app);
  const provider = new GoogleAuthProvider();
  const statusEl = document.getElementById('statusMsg');

  // 이미 로그인된 상태면 바로 index.html로
  onAuthStateChanged(auth, (user) => {
    if (user) {
      sessionStorage.setItem('rcm_player_name', user.displayName || user.email || '플레이어');
      window.location.replace('index.html');
    }
  });

  // 버튼 핸들러 전역 노출
  window.signInWithGoogle = async function() {
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>로그인 중...';
    statusEl.textContent = '';
    statusEl.className = 'status';
    try {
      const result = await signInWithPopup(auth, provider);
      const user = result.user;
      sessionStorage.setItem('rcm_player_name', user.displayName || user.email || '플레이어');
      statusEl.textContent = '로그인 완료! 이동 중...';
      setTimeout(() => window.location.replace('index.html'), 600);
    } catch(e) {
      console.error(e);
      btn.disabled = false;
      btn.innerHTML = `
        <svg width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"/>
        </svg>
        Google로 로그인`;
      if (e.code === 'auth/popup-closed-by-user') {
        statusEl.textContent = '팝업이 닫혔습니다. 다시 시도해주세요.';
      } else {
        statusEl.textContent = '로그인에 실패했습니다. 다시 시도해주세요.';
        statusEl.className = 'status error';
      }
    }
  };
</script>
</body>
</html>
