<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="color-scheme" content="light">
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>루프캣 AR 마커</title>
<style>
html{color-scheme:light;}
body { font-family:sans-serif; background:#f0ede8; padding:24px; }
h2 { font-size:18px; margin-bottom:20px; color:#333; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; max-width:600px; }
.card { background:white; border-radius:12px; padding:16px; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,0.08); }
.card svg { width:160px; height:160px; }
.card p { font-size:12px; color:#888; margin:8px 0 4px; }
.card strong { font-size:14px; color:#333; display:block; margin-bottom:10px; }
.dl { display:inline-block; background:#333; color:white; font-size:12px; padding:6px 16px; border-radius:20px; text-decoration:none; cursor:pointer; }
</style>
</head>
<body>
<h2>루프캣 AR 마커 — 우클릭 → 이미지 저장</h2>
<div class="grid">

<rect width="240" height="240" fill="white"/>
<rect x="12" y="12" width="216" height="216" rx="4" fill="black"/>

</div>

</div>

<div class="card">

</div>

<div style="margin-top:28px;background:white;border-radius:12px;padding:16px;max-width:600px;font-size:13px;color:#555;line-height:1.8;">
<strong style="color:#333;display:block;margin-bottom:8px;">다음 단계: .patt 파일 만들기</strong>

2. 아래 링크 접속 → 이미지 업로드 → Train 버튼<br/>

</div>
</body>
</html>
