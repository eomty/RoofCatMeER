<style>
:root{--paper:#f0e8d8;--paper2:#e8dcc8;--ink:#1a1410;--red:#8b1a1a;--gold:#8b6914;--muted:#5a4a38;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1a1410;font-family:'Noto Sans KR',sans-serif;color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 0 60px;}
.tape{width:100%;background:#f5c518;color:#1a1410;font-size:11px;font-weight:700;letter-spacing:.3em;text-align:center;padding:6px 0;position:fixed;top:0;z-index:100;border-bottom:2px solid #d4a800;}
.document{width:100%;max-width:420px;margin-top:36px;background:var(--paper);box-shadow:4px 4px 20px rgba(0,0,0,.5);}
.doc-header{background:var(--paper2);border-bottom:2px solid rgba(0,0,0,.15);padding:14px 18px 10px;}
.chapter-tag{display:inline-block;background:var(--red);color:#f0e8d8;font-size:10px;letter-spacing:.1em;padding:3px 10px;margin-bottom:6px;}
.doc-meta{display:flex;justify-content:space-between;align-items:flex-start;}
.doc-name-label{font-size:9px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase;}
.doc-name{font-family:'Nanum Myeongjo',serif;font-size:17px;font-weight:700;color:var(--ink);margin-top:2px;}
.doc-no{font-size:11px;color:var(--muted);border:1px solid rgba(0,0,0,.2);padding:2px 8px;border-radius:2px;background:rgba(255,255,255,.4);}
.doc-body{padding:18px 18px 24px;}
.story-text{font-size:13.5px;line-height:2;color:var(--ink);margin-bottom:14px;}
.quest-box{background:rgba(139,26,26,.06);border:1px solid rgba(139,26,26,.25);border-left:4px solid var(--red);padding:12px 14px;margin:14px 0;font-size:13px;font-weight:500;color:var(--red);line-height:1.7;}
.tear{height:2px;background:repeating-linear-gradient(90deg,transparent 0,transparent 6px,rgba(0,0,0,.12) 6px,rgba(0,0,0,.12) 8px);margin:16px 0;}
.section-title{font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
.hint-counter{font-size:10px;color:var(--red);background:rgba(139,26,26,.08);border:1px solid rgba(139,26,26,.2);padding:3px 10px;border-radius:10px;}
.hint-btn{width:100%;padding:12px;background:var(--ink);color:var(--paper);font-family:'Nanum Myeongjo',serif;font-size:14px;letter-spacing:.08em;border:none;border-radius:2px;cursor:pointer;margin-bottom:8px;}
.hint-btn:disabled{opacity:.4;cursor:default;}
.hint-item{background:rgba(139,105,20,.08);border:1px solid rgba(139,105,20,.25);border-radius:4px;padding:10px 14px;margin-bottom:6px;font-size:13px;color:var(--ink);line-height:1.7;display:none;}
.hint-item.visible{display:block;}
.hint-num{font-family:'Nanum Myeongjo',serif;font-size:11px;color:var(--gold);font-weight:700;display:block;margin-bottom:4px;}
.cipher-img{width:100%;border-radius:4px;margin-bottom:12px;border:1px solid rgba(0,0,0,.1);}
.answer-input{width:100%;padding:12px 14px;background:white;border:2px solid rgba(0,0,0,.15);border-radius:4px;font-size:14px;font-family:'Noto Sans KR',sans-serif;outline:none;margin-bottom:8px;transition:border-color .2s;}
.answer-input:focus{border-color:var(--red);}
.answer-btn{width:100%;padding:13px;background:var(--ink);color:var(--paper);font-family:'Nanum Myeongjo',serif;font-size:14px;letter-spacing:.08em;border:none;border-radius:2px;cursor:pointer;}
.answer-btn:active{opacity:.85;}
#result{display:none;padding:12px 14px;margin-top:8px;text-align:center;font-family:'Nanum Myeongjo',serif;font-size:15px;border-radius:4px;}
#result.correct{background:rgba(76,175,130,.15);border:1px solid #4caf82;color:#2d7a5a;}
#result.wrong{background:rgba(139,26,26,.08);border:1px solid var(--red);color:var(--red);}
.next-btn{width:100%;padding:14px;background:var(--red);color:var(--paper);font-family:'Nanum Myeongjo',serif;font-size:15px;border:none;border-radius:2px;cursor:pointer;margin-top:10px;display:none;letter-spacing:.08em;}
.tape-bottom{width:100%;max-width:420px;background:#f5c518;color:#1a1410;font-size:11px;font-weight:700;letter-spacing:.3em;text-align:center;padding:6px 0;border-top:2px solid #d4a800;}
</style>

<script>
var hintCount = 0;
function showHint() {
  if (hintCount >= 3) return;
  hintCount++;
  document.getElementById('hint' + hintCount).classList.add('visible');
  var remaining = 3 - hintCount;
  document.getElementById('hint-counter').textContent = remaining + '회 남음';
  if (hintCount >= 3) {
    document.getElementById('hint-btn').disabled = true;
    document.getElementById('hint-btn').textContent = '힌트 소진';
    document.getElementById('hint-counter').textContent = '0회 남음';
  }
}

function checkAnswer() {
  var val = document.getElementById('answer').value.trim();
  var result = document.getElementById('result');
  var answers = ['밖이 보이는 파란 창문집', '밖이보이는파란창문집'];
  result.style.display = 'block';
  if (answers.indexOf(val) !== -1) {
    result.className = 'correct';
    result.innerHTML = '✓ 정답입니다!<br/><span style="font-size:13px;font-weight:normal">위치를 알아냈습니다. 이동하세요!</span>';
    document.getElementById('next-btn').style.display = 'block';
    document.getElementById('answer').disabled = true;
    if (navigator.vibrate) navigator.vibrate([100,50,100,50,200]);
  } else {
    result.className = 'wrong';
    result.textContent = '✗ 틀렸습니다. 다시 시도해보세요.';
    if (navigator.vibrate) navigator.vibrate(200);
  }
}

document.getElementById('answer').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') checkAnswer();
});
</script>
