<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>수사 결과</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root{--paper:#f0e8d8;--paper2:#e8dcc8;--ink:#1a1410;--red:#8b1a1a;--gold:#8b6914;--muted:#5a4a38;--green:#4caf82;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1a1410;font-family:'Noto Sans KR',sans-serif;color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 0 60px;}
.tape{width:100%;background:#f5c518;color:#1a1410;font-size:9px;font-weight:700;letter-spacing:.12em;text-align:center;padding:7px 0;position:fixed;top:0;z-index:100;border-bottom:2px solid #d4a800;white-space:nowrap;overflow:hidden;}
.document{width:100%;max-width:420px;margin-top:36px;background:var(--paper);box-shadow:4px 4px 20px rgba(0,0,0,.5);}
.doc-header{background:var(--paper2);border-bottom:2px solid rgba(0,0,0,.15);padding:14px 18px 10px;text-align:center;}
.doc-header-label{font-size:9px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-bottom:4px;}
.doc-title{font-family:'Nanum Myeongjo',serif;font-size:20px;font-weight:800;color:var(--ink);}
.doc-body{padding:20px 18px 24px;}
.tear{height:2px;background:repeating-linear-gradient(90deg,transparent 0,transparent 6px,rgba(0,0,0,.12) 6px,rgba(0,0,0,.12) 8px);margin:18px 0;}

.rank-card{text-align:center;padding:18px 0;}
.rank-badge{display:inline-flex;align-items:center;justify-content:center;width:82px;height:82px;border-radius:0;font-family:'Nanum Myeongjo',serif;font-size:50px;font-weight:800;margin-bottom:10px;transform:rotate(-5deg);border:3px solid;background:transparent;}
.rank-badge.S{color:#8b6914;border-color:#8b6914;}
.rank-badge.A{color:#2d6b3a;border-color:#2d6b3a;}
.rank-badge.B{color:#1a4080;border-color:#1a4080;}
.rank-badge.C{color:#5a4a38;border-color:#5a4a38;}
.rank-time{font-family:monospace;font-size:24px;color:var(--ink);font-weight:700;margin-bottom:4px;}
.rank-reward{font-size:13px;color:var(--muted);}
.rank-reward b{color:var(--red);}

.section-title{font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-bottom:10px;}
.breakdown-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(0,0,0,.08);font-size:13px;}
.breakdown-row:last-child{border-bottom:none;}
.breakdown-row .ch-name{color:var(--ink);}
.breakdown-row .ch-time{font-family:monospace;color:var(--muted);}
.breakdown-row.slowest .ch-name{color:var(--red);font-weight:700;}
.breakdown-row.slowest .ch-time{color:var(--red);font-weight:700;}
.slowest-tag{font-size:9px;background:var(--red);color:var(--paper);padding:1px 6px;border-radius:8px;margin-left:6px;}

.stat-grid{display:flex;gap:10px;margin:14px 0;}
.stat-box{flex:1;background:rgba(0,0,0,.03);border-radius:6px;padding:10px;text-align:center;}
.stat-box .num{font-family:monospace;font-size:18px;font-weight:700;color:var(--ink);}
.stat-box .label{font-size:10px;color:var(--muted);margin-top:2px;}

.restart-btn{width:100%;padding:14px;background:var(--ink);color:var(--paper);font-family:'Nanum Myeongjo',serif;font-size:14px;border:none;border-radius:4px;cursor:pointer;margin-top:10px;letter-spacing:.08em;}
.tape-bottom{width:100%;align-self:stretch;background:#f5c518;color:#1a1410;font-size:9px;font-weight:700;letter-spacing:.12em;text-align:center;padding:7px 0;border-top:2px solid #d4a800;white-space:nowrap;overflow:hidden;}
</style>
</head>
<body>
<script src="debug-config.js"></script>
<script src="rcm-common.js"></script>
<script src="flow-guard.js"></script>
<script src="debug-panel.js"></script>
<div class="tape">POLICE LINE DO NOT CROSS · POLICE LINE DO NOT CROSS · POLICE LINE DO NOT CROSS</div>

<div class="document">
  <div class="doc-header">
    <div class="doc-header-label">CASE CLOSED</div>
    <div class="doc-title">수사 종료 — 사건 결과</div>
  </div>

  <div class="doc-body">

    <div class="rank-card">
      <div class="rank-badge" id="rank-badge">-</div>
      <div class="rank-time" id="rank-time">--:--</div>
      <div class="rank-reward" id="rank-reward">집계 중...</div>
    </div>

    <div class="tear"></div>

    <div class="section-title">챕터별 소요 기록</div>
    <div id="breakdown-list"></div>

    <div class="stat-grid">
      <div class="stat-box">
        <div class="num" id="stat-hints">0</div>
        <div class="label">사용한 힌트</div>
      </div>
      <div class="stat-box">
        <div class="num" id="stat-wrongs">0</div>
        <div class="label">오답 횟수</div>
      </div>
    </div>

    <button class="restart-btn" onclick="restartGame()">처음으로 돌아가기</button>

  </div>
</div>

<div style="height:20px"></div>
<div class="tape-bottom">POLICE LINE DO NOT CROSS · POLICE LINE DO NOT CROSS</div>

<script src="timer.js"></script>
<script>
var CHAPTER_LABELS = {
  chapter1: '챕터 1', chapter2: '챕터 2', chapter3: '챕터 3',
  chapter4: '챕터 4', chapter5: '챕터 5', chapter6: '챕터 6', chapter7: '챕터 7'
};

function render(){
  var finalSec = RCMTimer.getElapsedSec();
  var rank = RCMTimer.getRank(finalSec);

  var badge = document.getElementById('rank-badge');
  badge.textContent = rank.grade;
  badge.classList.add(rank.grade);

  document.getElementById('rank-time').textContent = RCMTimer.formatTime(finalSec);
  document.getElementById('rank-reward').innerHTML = '획득 보상: <b>' + rank.reward + '</b>';

  var breakdown = RCMTimer.getChapterBreakdown();
  var maxSec = 0, maxIdx = -1;
  breakdown.forEach(function(b, i){
    if (b.sec > maxSec) { maxSec = b.sec; maxIdx = i; }
  });

  var listEl = document.getElementById('breakdown-list');
  listEl.innerHTML = '';
  breakdown.forEach(function(b, i){
    var row = document.createElement('div');
    row.className = 'breakdown-row' + (i === maxIdx && maxSec > 0 ? ' slowest' : '');
    var label = CHAPTER_LABELS[b.chapter] || b.chapter;
    var slowTag = (i === maxIdx && maxSec > 0) ? '<span class="slowest-tag">최장 소요</span>' : '';
    row.innerHTML = '<span class="ch-name">' + label + slowTag + '</span><span class="ch-time">' + RCMTimer.formatTime(b.sec) + '</span>';
    listEl.appendChild(row);
  });

  var hintTotal = 0, wrongTotal = 0;
  try {
    var raw = JSON.parse(localStorage.getItem('rcm_timer') || '{}');
    hintTotal = Object.keys(raw.hintCounts || {}).length;
    Object.values(raw.wrongCounts || {}).forEach(function(v){ wrongTotal += v; });
  } catch(e){}
  document.getElementById('stat-hints').textContent = hintTotal;
  document.getElementById('stat-wrongs').textContent = wrongTotal;
}
render();

function restartGame(){
  RCMTimer.resetAll();
  location.href = 'index.html';
}
</script>

</body>
</html>
