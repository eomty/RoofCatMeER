<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>수사 결과</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root{--paper:#f0e8d8;--paper2:#e8dcc8;--ink:#1a1410;--red:#8b1a1a;--gold:#8b6914;--muted:#5a4a38;--green:#4caf82;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1a1410;font-family:'Noto Sans KR',sans-serif;color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 0 60px;}
.tape{width:100%;background:#f5c518;color:#1a1410;font-size:9px;font-weight:700;letter-spacing:.12em;text-align:center;padding:7px 0;position:fixed;top:0;z-index:100;border-bottom:2px solid #d4a800;white-space:nowrap;overflow:hidden;}

.document{width:100%;max-width:420px;margin-top:36px;background:var(--paper);box-shadow:4px 4px 24px rgba(0,0,0,.6);}

/* 상단 다크 히어로 영역 */
.result-hero{background:#12100c;padding:28px 20px 24px;text-align:center;border-bottom:1px solid rgba(201,168,76,.2);position:relative;}
.hero-eyebrow{font-family:monospace;font-size:9px;color:#776e5e;letter-spacing:.3em;margin-bottom:20px;}

/* 랭크 스탬프 */
.rank-stamp{display:inline-block;margin-bottom:16px;position:relative;}
.rank-stamp-inner{
  font-family:'Nanum Myeongjo',serif;
  font-size:52px;font-weight:800;
  color:#c9a84c;
  border:3px solid #c9a84c;
  width:80px;height:80px;
  display:flex;align-items:center;justify-content:center;
  transform:rotate(-4deg);
  letter-spacing:0;
  opacity:.95;
}
.rank-stamp-inner.A{color:#4caf82;border-color:#4caf82;}
.rank-stamp-inner.B{color:#6098d0;border-color:#6098d0;}
.rank-stamp-inner.C{color:#a0907a;border-color:#a0907a;}

.hero-time{font-family:monospace;font-size:38px;font-weight:700;color:#e8e4d8;letter-spacing:.04em;margin-bottom:8px;}
.hero-label{font-size:10px;color:#776e5e;letter-spacing:.15em;margin-bottom:14px;}
.hero-reward{display:inline-block;background:rgba(139,26,26,.25);border:1px solid rgba(139,26,26,.5);color:#e8c0b0;font-family:'Nanum Myeongjo',serif;font-size:13px;padding:6px 16px;letter-spacing:.05em;}

/* 본문 */
.doc-body{padding:22px 20px 26px;}
.tear{height:2px;background:repeating-linear-gradient(90deg,transparent 0,transparent 6px,rgba(0,0,0,.12) 6px,rgba(0,0,0,.12) 8px);margin:20px 0;}

.section-title{font-family:monospace;font-size:9px;letter-spacing:.25em;color:#a09080;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.section-title::after{content:'';flex:1;height:1px;background:rgba(0,0,0,.1);}

.breakdown-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(0,0,0,.07);font-size:13.5px;}
.breakdown-row:last-child{border-bottom:none;}
.ch-name{color:var(--ink);}
.ch-time{font-family:monospace;font-size:13px;color:var(--muted);}
.breakdown-row.slowest .ch-name{color:var(--red);font-weight:700;}
.breakdown-row.slowest .ch-time{color:var(--red);font-weight:700;}
.slowest-tag{font-size:9px;background:var(--red);color:var(--paper);padding:2px 7px;border-radius:2px;margin-left:7px;vertical-align:1px;letter-spacing:.05em;}

.stat-grid{display:flex;gap:10px;margin:4px 0 20px;}
.stat-box{flex:1;border:1px solid rgba(0,0,0,.12);padding:12px 10px;text-align:center;background:rgba(0,0,0,.02);}
.stat-num{font-family:monospace;font-size:22px;font-weight:700;color:var(--ink);}
.stat-label{font-size:10px;color:var(--muted);margin-top:3px;letter-spacing:.05em;}

.btn{width:100%;padding:15px;font-family:'Nanum Myeongjo',serif;font-size:15px;border:none;cursor:pointer;letter-spacing:.08em;margin-bottom:10px;}
.btn:last-child{margin-bottom:0;}
.btn-primary{background:var(--red);color:var(--paper);}
.btn-secondary{background:transparent;color:var(--ink);border:1px solid rgba(0,0,0,.2);}

.tape-bottom{width:100%;align-self:stretch;background:#f5c518;color:#1a1410;font-size:9px;font-weight:700;letter-spacing:.12em;text-align:center;padding:7px 0;border-top:2px solid #d4a800;white-space:nowrap;overflow:hidden;}
</style>
</head>
<body>
<script src="debug-config.js"></script>
<script src="rcm-common.js"></script>
<script src="flow-guard.js"></script>
<script src="debug-panel.js"></script>
<div class="tape">POLICE LINE DO NOT CROSS · POLICE LINE DO NOT CROSS · POLICE LINE DO NOT CROSS</div>

<div class="document">
  <div class="result-hero">
    <div class="hero-eyebrow">CASE CLOSED · 수사 종료</div>
    <div class="rank-stamp">
      <div class="rank-stamp-inner" id="rank-badge">-</div>
    </div>
    <div class="hero-time" id="rank-time">--:--</div>
    <div class="hero-label">FINAL RECORD · 챕터 1~7 합산</div>
    <div class="hero-reward" id="rank-reward">집계 중...</div>
  </div>

  <div class="doc-body">

    <div class="section-title">챕터별 소요 기록</div>
    <div id="breakdown-list"></div>

    <div class="tear"></div>

    <div class="stat-grid">
      <div class="stat-box">
        <div class="stat-num" id="stat-hints">0</div>
        <div class="stat-label">사용한 힌트</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="stat-wrongs">0</div>
        <div class="stat-label">오답 횟수</div>
      </div>
    </div>

    <button class="btn btn-primary" onclick="location.href='ranking.html'">🏆 수사 기록 보기</button>
    <button class="btn btn-secondary" onclick="restartGame()">처음으로 돌아가기</button>

  </div>
</div>

<div style="height:20px"></div>
<div class="tape-bottom">POLICE LINE DO NOT CROSS · POLICE LINE DO NOT CROSS</div>

<script src="timer.js"></script>
<script>
var CHAPTER_LABELS = {
  chapter1:'챕터 1',chapter2:'챕터 2',chapter3:'챕터 3',
  chapter4:'챕터 4',chapter5:'챕터 5',chapter6:'챕터 6',chapter7:'챕터 7'
};

function render(){
  var finalSec = RCMTimer.getElapsedSec();
  var rank = RCMTimer.getRank(finalSec);

  var badge = document.getElementById('rank-badge');
  badge.textContent = rank.grade;
  if(rank.grade !== 'S') badge.classList.add(rank.grade);

  document.getElementById('rank-time').textContent = RCMTimer.formatTime(finalSec);
  document.getElementById('rank-reward').textContent = '보상 · ' + rank.reward;

  var breakdown = RCMTimer.getChapterBreakdown();
  var maxSec = 0, maxIdx = -1;
  breakdown.forEach(function(b,i){ if(b.sec > maxSec){maxSec=b.sec;maxIdx=i;} });

  var listEl = document.getElementById('breakdown-list');
  listEl.innerHTML = '';
  breakdown.forEach(function(b,i){
    var row = document.createElement('div');
    row.className = 'breakdown-row' + (i===maxIdx && maxSec>0?' slowest':'');
    var label = CHAPTER_LABELS[b.chapter] || b.chapter;
    var slowTag = (i===maxIdx && maxSec>0)?'<span class="slowest-tag">최장</span>':'';
    row.innerHTML = '<span class="ch-name">'+label+slowTag+'</span><span class="ch-time">'+RCMTimer.formatTime(b.sec)+'</span>';
    listEl.appendChild(row);
  });

  var hintTotal=0, wrongTotal=0;
  try{
    var raw = JSON.parse(localStorage.getItem('rcm_timer')||'{}');
    hintTotal = Object.keys(raw.hintCounts||{}).length;
    Object.values(raw.wrongCounts||{}).forEach(function(v){wrongTotal+=v;});
  }catch(e){}
  document.getElementById('stat-hints').textContent = hintTotal;
  document.getElementById('stat-wrongs').textContent = wrongTotal;
}
render();

function restartGame(){
  RCMTimer.resetAll();
  sessionStorage.removeItem('rcm_player_name');
  location.href='index.html';
}
</script>
</body>
</html>
